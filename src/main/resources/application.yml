spring:
  application:
    name: pmevent

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    fr.pmevent: INFO

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}